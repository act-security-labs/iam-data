name: Update Dependencies

on:
  schedule:
    - cron: '5 8 * * 6' # Every Saturday at 08:05 UTC
  workflow_dispatch:

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push branches, merge PRs, delete branches
      pull-requests: write # Create and merge PRs
    steps:
      - name: Run dependency update
        uses: cloud-copilot/action-update-dependencies@c91f020c74faf612daf4297704c78b6898feaae0
